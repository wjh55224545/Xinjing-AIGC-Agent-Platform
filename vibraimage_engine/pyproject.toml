[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibraimage-engine"
version = "0.2.0"
description = "A clean-room, from-scratch implementation of the VibraImage facial vibration emotion recognition engine, packaged as a reusable open-source component"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["vibraimage", "emotion-recognition", "computer-vision", "opencv", "psychophysiology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
gpu = ["ultralytics>=8.0.0"]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/wjh55224545/Xinjing-AIGC-Agent-Platform"

[tool.setuptools.packages.find]
include = ["vibraimage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
