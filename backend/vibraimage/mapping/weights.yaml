# E1-E12 -> 效价 (Valence) / 唤醒度 (Arousal) 权重矩阵
# 基于 VCE 专著中各参数的心理学语义设定（初始猜测值）
# 通过 calibrate.py 可用标注数据校正（Pearson r）
#
# 效价：正性=[0,1], 越高越积极
# 唤醒度：激活程度=[0,1], 越高越兴奋/紧张
#
# 2026-08-27 修正：E5 Balance / E6 Charm / E8 Self-Regulation 在原著中
# 主要表示稳定性、左右对称性、自我调节能力；它们是“负性风险的保护项”，
# 不能等同于 E12 Happiness 这类直接正性情绪证据。因此将三者的直接
# Valence 正权重从强证据降为弱保护项，避免 calm/relax 视频因 E5/E6/E8
# 稳定而把 V_vi 推到接近 +1 的饱和区。

weights:
  valence:
    aggression:      -0.8
    stress:          -0.7
    tension:         -0.7
    suspicious:      -0.6
    balance:          0.05
    charm:            0.05
    energy:           0.3
    self_regulation:  0.05
    inhibition:      -0.3
    neuroticism:     -0.5
    depression:      -0.7
    happiness:        0.9

  arousal:
    aggression:       0.7
    stress:           0.8
    tension:          0.7
    suspicious:       0.4
    balance:         -0.3
    charm:            0.2
    energy:           0.8
    self_regulation: -0.5
    inhibition:      -0.4
    neuroticism:      0.5
    depression:      -0.6
    happiness:        0.2

# E1-E12 参数值归一化参考范围 [min, max]
# 基于 NORMAL_NORMS ± 3*NORMAL_SDS (VCE Table 6-18)
normalization:
  aggression:      [18.0, 63.0]
  stress:          [9.0, 54.0]
  tension:         [5.0, 56.0]
  suspicious:      [9.0, 47.0]
  balance:         [30.0, 93.0]
  charm:           [17.0, 96.0]
  energy:          [2.0, 90.0]
  self_regulation: [12.0, 98.0]
  inhibition:      [0.0, 59.0]
  neuroticism:     [0.0, 70.0]
  depression:      [7.0, 55.0]
  happiness:       [21.0, 79.0]

# 10 类情绪在效价 - 唤醒度二维空间中的定义区域
# 坐标已转换为 [-1, 1] 尺度 (原 [0,1] 坐标 * 2 - 1)
emotion_regions:
  calm_relaxed:        # 平静/放松 — center (~0.44, ~-0.16)
    valence:    [-0.04, 0.92]
    arousal:    [-0.88, -0.16]
    label:      "平静/放松"
    label_en:   "calm_relaxed"
  angry_irritable:     # 愤怒/烦躁 — center (~-0.76, ~0.76)
    valence:    [-1.00, -0.52]
    arousal:    [0.56, 0.96]
    label:      "愤怒/烦躁"
    label_en:   "angry_irritable"
  anxious_worried:     # 焦虑/担忧 — center (~-0.56, ~0.40)
    valence:    [-1.00, -0.12]
    arousal:    [0.12, 0.68]
    label:      "焦虑/担忧"
    label_en:   "anxious_worried"
  nervous_uneasy:      # 紧张/不安 — center (~-0.50, ~0.04)
    valence:    [-0.96, -0.04]
    arousal:    [-0.24, 0.32]
    label:      "紧张/不安"
    label_en:   "nervous_uneasy"
  sad_low:             # 低落/悲伤 — center (~-0.64, ~-0.24)
    valence:    [-1.00, -0.28]
    arousal:    [-0.36, -0.12]
    label:      "低落/悲伤"
    label_en:   "sad_low"
  fatigued_exhausted:  # 疲惫/倦怠 — center (~-0.60, ~-0.64)
    valence:    [-1.00, -0.20]
    arousal:    [-1.00, -0.28]
    label:      "疲惫/倦怠"
    label_en:   "fatigued_exhausted"
  focused_engaged:     # 专注/投入 — center (~0.44, ~-0.16)
    valence:    [0.04, 0.84]
    arousal:    [-0.32, 0.00]
    label:      "专注/投入"
    label_en:   "focused_engaged"
  happy_cheerful:      # 愉悦/开心 — center (~0.60, ~0.08)
    valence:    [0.20, 1.00]
    arousal:    [-0.16, 0.32]
    label:      "愉悦/开心"
    label_en:   "happy_cheerful"
  excited_elated:      # 兴奋/激动 — center (~0.60, ~0.60)
    valence:    [0.20, 1.00]
    arousal:    [0.36, 0.84]
    label:      "兴奋/激动"
    label_en:   "excited_elated"
  content_serene:      # 满足/安详 — center (~0.60, ~-0.64)
    valence:    [0.24, 0.96]
    arousal:    [-1.00, -0.28]
    label:      "满足/安详"
    label_en:   "content_serene"

# 无法归入任何区域时的默认标签
default_emotion: "中性"
default_emotion_en: "neutral"
