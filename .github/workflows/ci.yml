name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: 后端全量测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装中文字体（PDF 测试用）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 安装测试依赖
        run: pip install -r requirements-ci.txt

      - name: 安装引擎包（组件冒烟：验证 pyproject 可安装）
        run: pip install -e ./vibraimage_engine --no-deps

      - name: 组件导入冒烟（GPU 适配层 / 通用 ReAct 框架）
        run: |
          python -c "from backend.gpu import detect_gpu, get_array_module; print('GPU组件 OK')"
          python -c "from backend.agents.framework import ReactAgent, ToolSpec; print('Agent框架 OK')"
          python -c "import vibraimage; print('引擎包 OK', vibraimage.__version__)"

      - name: 运行全量测试
        run: |
          python -m pytest tests/ vibraimage_engine/tests -q
          echo "TEST_COUNT=$(python -m pytest tests/ vibraimage_engine/tests --collect-only -q | tail -1)" >> $GITHUB_ENV

      - name: 输出测试统计
        run: echo "收集到的测试：${{ env.TEST_COUNT }}"

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: cd frontend && npm ci

      - name: 构建前端
        run: cd frontend && npm run build
